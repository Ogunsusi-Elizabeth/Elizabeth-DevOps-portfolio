name: Deploy portfolio to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_INSTANCE_ID: i-0ffeebb5e65b09f0b
      SITE_URL: http://ec2-13-60-104-0.eu-north-1.compute.amazonaws.com/

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate site and test Docker image
        run: |
          set -euo pipefail
          test -s index.html
          test -f Dockerfile
          test -s assets/OGUNSUSI-Elizabeth-Bukola-CV.pdf
          grep -q 'href="#projects"' index.html

          docker build -t elizabeth-portfolio:ci .
          docker run --detach --name portfolio-smoke-test elizabeth-portfolio:ci
          trap 'docker rm -f portfolio-smoke-test >/dev/null 2>&1 || true' EXIT

          sleep 2
          docker exec portfolio-smoke-test wget -q -O /tmp/portfolio-home.html http://127.0.0.1/
          docker exec portfolio-smoke-test grep -q "OGUNSUSI" /tmp/portfolio-home.html
          docker exec portfolio-smoke-test test -s /usr/share/nginx/html/assets/OGUNSUSI-Elizabeth-Bukola-CV.pdf
          
      - name: Check public website
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 6 \
            "$SITE_URL" --output /tmp/live-portfolio.html
          grep -q "OGUNSUSI" /tmp/live-portfolio.html
          echo "Public website responded successfully at $SITE_URL"
