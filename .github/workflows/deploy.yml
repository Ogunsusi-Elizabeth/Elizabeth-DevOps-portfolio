name: Deploy portfolio to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::922839637125:role/github-actions-portfolio-deploy-role
          aws-region: eu-north-1

      - name: Deploy through Systems Manager
        shell: bash
        run: |
          cat > ssm-command.json <<'JSON'
          {
            "InstanceIds": ["i-0ffeebb5e65b09f0b"],
            "DocumentName": "AWS-RunShellScript",
            "Comment": "Deploy portfolio from GitHub Actions",
            "Parameters": {
              "commands": [
                "set -e",
                "sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/Elizabeth-DevOps-portfolio && git pull --ff-only origin main && docker build -t elizabeth-portfolio .'",
                "docker rm -f elizabeth-portfolio || true",
                "docker run -d --name elizabeth-portfolio -p 80:80 --restart unless-stopped elizabeth-portfolio"
              ]
            }
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm-command.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0ffeebb5e65b09f0b"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0ffeebb5e65b09f0b" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
