name: Deploy portfolio to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      EC2_INSTANCE_ID: i-0ffeebb5e65b09f0b
      SITE_URL: http://ec2-13-60-104-0.eu-north-1.compute.amazonaws.com/
      AWS_REGION: eu-north-1
      AWS_ROLE_ARN: arn:aws:iam::922839637125:role/github-actions-portfolio-deploy-role

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate site and test Docker image
        run: |
          set -euo pipefail
          test -s index.html
          test -f Dockerfile
          test -s assets/OGUNSUSI-Elizabeth-Bukola-CV.pdf
          grep -q 'href="#projects"' index.html

          docker build -t elizabeth-portfolio:ci .
          docker run --detach --name portfolio-smoke-test elizabeth-portfolio:ci
          trap 'docker rm -f portfolio-smoke-test >/dev/null 2>&1 || true' EXIT

          sleep 2
          docker exec portfolio-smoke-test wget -q -O /tmp/portfolio.html http://127.0.0.1/
          docker exec portfolio-smoke-test grep -q "OGUNSUSI" /tmp/portfolio.html
          docker exec portfolio-smoke-test test -s /usr/share/nginx/html/assets/OGUNSUSI-Elizabeth-Bukola-CV.pdf

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::922839637125:role/github-actions-portfolio-deploy-role
          aws-region: eu-north-1

      - name: Deploy this commit through Systems Manager
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          sha = os.environ["GITHUB_SHA"]
          script = f"""set -e
          sudo -u ubuntu -H bash -lc 'set -e; cd /home/ubuntu/Elizabeth-DevOps-portfolio; git fetch origin main; git checkout --detach {sha}; docker build -t elizabeth-portfolio:{sha} .; docker rm -f elizabeth-portfolio >/dev/null 2>&1 || true; docker run -d --name elizabeth-portfolio -p 80:80 --restart unless-stopped elizabeth-portfolio:{sha}'
          """

          request = {
              "InstanceIds": [os.environ["EC2_INSTANCE_ID"]],
              "DocumentName": "AWS-RunShellScript",
              "Parameters": {"commands": [script]},
          }

          with open("ssm-command.json", "w", encoding="utf-8") as file:
              json.dump(request, file)
          PY

          COMMAND_ID="$(aws ssm send-command \
            --cli-input-json file://ssm-command.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

      - name: Check public website and updated text
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 6 \
            "$SITE_URL" --output /tmp/live-portfolio.html
          grep -q "automated subsequent builds and deployments with GitHub Actions and AWS Systems Manager" /tmp/live-portfolio.html
          echo "The updated portfolio is live at $SITE_URL"
